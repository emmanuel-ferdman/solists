version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "eslint"
      mocha:
        patterns:
          - "mocha"
          - "nyc"
      typescript:
        patterns:
          - "ts-node"
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
